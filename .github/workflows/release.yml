# Publishes a signed, notarized Loophole.dmg as a GitHub release when a version tag is pushed:
#
#   git tag v1.0 && git push origin v1.0
#
# Until the secrets below are configured the workflow does nothing, so releases built locally
# with scripts/release.sh and published by hand are unaffected.
#
# Repository secrets required (Settings → Secrets and variables → Actions):
#   DEVELOPER_ID_P12_BASE64   the "Developer ID Application" certificate and private key,
#                             exported from Keychain Access as .p12, then `base64 -i cert.p12`
#   DEVELOPER_ID_P12_PASSWORD the password chosen for that export
#   NOTARY_KEY_P8_BASE64      an App Store Connect API key (.p8), base64-encoded
#   NOTARY_KEY_ID             that key's ID
#   NOTARY_ISSUER_ID          the issuer ID shown next to it in App Store Connect
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing secrets
        id: signing
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [[ -n "$P12_BASE64" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Signing secrets are not configured; skipping the automated release."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.signing.outputs.ready == 'true'
        run: swift test

      - name: Import the signing certificate
        if: steps.signing.outputs.ready == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build, sign, notarize and package
        if: steps.signing.outputs.ready == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          VERSION="${GITHUB_REF_NAME#v}" NOTARY_KEY="$RUNNER_TEMP/notary.p8" scripts/release.sh
          rm "$RUNNER_TEMP/notary.p8"

      - name: Publish the release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Loophole-*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Loophole-*.dmg \
              --title "Loophole ${GITHUB_REF_NAME#v}" --generate-notes
          fi
